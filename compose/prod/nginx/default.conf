server {
    listen 80;
    server_name qualilead.options.net;

    # Emplacement où Certbot placera les défis
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP → HTTPS (hors vérification ACME)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name www.greathire.com greathire.com;

    # Emplacement où Certbot placera les défis
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTP → HTTPS (hors vérification ACME)
    location / {
        return 301 https://www.options-greathire.co.uk/;
    }
}

server {
    listen 443 ssl http2;
    server_name www.greathire.com greathire.com;

    ssl_certificate     /etc/letsencrypt/live/www.greathire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.greathire.com/privkey.pem;

    # Sécurité minimale
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Redirection HTTP → HTTPS (hors vérification ACME)
    location / {
        return 301 https://www.options-greathire.co.uk/;
    }
}

server {
    listen 443 ssl http2;
    server_name qualilead.options.net;

    ssl_certificate     /etc/letsencrypt/live/qualilead.options.net-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qualilead.options.net-0001/privkey.pem;

    # Sécurité minimale
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;


    # 🔁 Proxy vers l’API Django
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "Qualilead Secure area - Authentication required";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    location /swagger/ {
        proxy_pass http://backend:8000/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "Qualilead Secure area - Authentication required";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    location /redoc/ {
        proxy_pass http://backend:8000/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "Qualilead Secure area - Authentication required";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    location /swagger.json {
        proxy_pass http://backend:8000/swagger.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "Qualilead Secure area - Authentication required";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }


    # 🎨 Sert les fichiers statiques Django (admin, CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
    }
    # 🎯 Sert le frontend React statique depuis la racine /
   location / {
        proxy_pass http://frontend:5173/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        auth_basic "Qualilead Secure area - Authentication required";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }



}
